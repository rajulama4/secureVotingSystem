<div class="change-page">
  <div class="change-left">
    <mat-icon class="brand-icon">lock_reset</mat-icon>
    <h1>Secure Your Account</h1>
    <p>
      For security reasons, you must change your temporary password before continuing.
    </p>
  </div>

  <mat-card class="change-card">
    <div class="card-header">
      <mat-icon class="header-icon">vpn_key</mat-icon>
      <h2>Change Password</h2>
      <p>Set a strong password to secure your account.</p>
    </div>

    <div *ngIf="error" class="error">
      <mat-icon>error_outline</mat-icon>
      <span>{{ error }}</span>
    </div>

    <div *ngIf="success" class="success">
      <mat-icon>check_circle</mat-icon>
      <span>{{ success }}</span>
    </div>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>New Password</mat-label>
      <input matInput type="password" [(ngModel)]="newPassword" />
      <mat-icon matSuffix>lock</mat-icon>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Confirm Password</mat-label>
      <input matInput type="password" [(ngModel)]="confirmPassword" />
      <mat-icon matSuffix>lock</mat-icon>
    </mat-form-field>

    <button
      mat-raised-button
      color="primary"
      class="full-width update-btn"
      (click)="submit()"
      [disabled]="loading">
      
      <span *ngIf="!loading">Update Password</span>

      <span *ngIf="loading" class="loading-content">
        <mat-spinner diameter="18"></mat-spinner>
        Updating...
      </span>
    </button>
  </mat-card>
</div>
